<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ネオン迷路（改良版）</title>
<style>
  body { margin:0; background:#000; overflow:hidden; }
  canvas { display:block; image-rendering:pixelated; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

function resize(){
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
window.addEventListener("resize", resize);
resize();

// 少し小さくして遊びやすく
const SIZE = 41;
const maze = Array.from({length: SIZE}, () => Array(SIZE).fill(1));

// 基本迷路（一本道）
function generateMaze(x,y){
  const dirs = [[2,0],[-2,0],[0,2],[0,-2]].sort(()=>Math.random()-0.5);
  for (let [dx,dy] of dirs){
    const nx = x+dx, ny = y+dy;
    if (ny>0 && ny<SIZE-1 && nx>0 && nx<SIZE-1 && maze[ny][nx]===1){
      maze[ny][nx]=0;
      maze[y+dy/2][x+dx/2]=0;
      generateMaze(nx,ny);
    }
  }
}

maze[1][1]=0;
generateMaze(1,1);

// 分かれ道を追加（ここが今回の神ポイント）
function addBranches(rate=0.1){
  for (let y=1;y<SIZE-1;y++){
    for (let x=1;x<SIZE-1;x++){
      if (maze[y][x]===1 && Math.random()<rate){
        // 周囲に道が2つ以上あれば壁を壊す
        let count=0;
        if (maze[y+1][x]===0) count++;
        if (maze[y-1][x]===0) count++;
        if (maze[y][x+1]===0) count++;
        if (maze[y][x-1]===0) count++;
        if (count>=2) maze[y][x]=0;
      }
    }
  }
}

addBranches(0.15); // 分岐量調整できる

// 一番遠い場所をゴールに
function findFarthest(){
  const visited = Array.from({length: SIZE},()=>Array(SIZE).fill(false));
  const q=[{x:1,y:1,d:0}];
  visited[1][1]=true;
  let far={x:1,y:1,d:0};

  while(q.length){
    const {x,y,d}=q.shift();
    if (d>far.d) far={x,y,d};
    [[1,0],[-1,0],[0,1],[0,-1]].forEach(([dx,dy])=>{
      const nx=x+dx, ny=y+dy;
      if (maze[ny] && maze[ny][nx]===0 && !visited[ny][nx]){
        visited[ny][nx]=true;
        q.push({x:nx,y:ny,d:d+1});
      }
    });
  }
  return far;
}

let player={x:1,y:1};
let goal=findFarthest();

function draw(){
  const tile = Math.floor(Math.min(canvas.width,canvas.height)/SIZE);
  ctx.clearRect(0,0,canvas.width,canvas.height);

  // ===== 迷路 =====
  ctx.save();
  ctx.shadowBlur = 0;
  for (let y=0;y<SIZE;y++){
    for (let x=0;x<SIZE;x++){
      ctx.fillStyle = maze[y][x] ? "#6a00ff" : "#000";
      ctx.fillRect(x*tile,y*tile,tile,tile);
    }
  }

  // ゴール
  ctx.fillStyle="yellow";
  ctx.fillRect(goal.x*tile,goal.y*tile,tile,tile);

  // プレイヤー
  ctx.fillStyle="#00ffcc";
  ctx.fillRect(player.x*tile,player.y*tile,tile,tile);
  ctx.restore();

  // ===== 視界制限（最終安定版） =====
  ctx.save();

  // 暗闇レイヤー
  ctx.fillStyle = "rgba(0,0,0,0.92)";
  ctx.fillRect(0,0,canvas.width,canvas.height);

  // くり抜き
  ctx.globalCompositeOperation = "destination-out";
  ctx.beginPath();

  const radius = tile * 3;

  // プレイヤー
  ctx.arc(player.x*tile + tile/2, player.y*tile + tile/2, radius, 0, Math.PI*2);

  // ゴール
  ctx.moveTo(goal.x*tile + tile/2 + radius, goal.y*tile + tile/2);
  ctx.arc(goal.x*tile + tile/2, goal.y*tile + tile/2, radius, 0, Math.PI*2);

  ctx.fill();

  ctx.restore();
} else {
        ctx.fillStyle="#000";
      }
      ctx.fillRect(x*tile,y*tile,tile,tile);
    }
  }

  // ゴール
  ctx.fillStyle="yellow";
  ctx.fillRect(goal.x*tile,goal.y*tile,tile,tile);

  // プレイヤー
  ctx.fillStyle="#00ffcc";
  ctx.fillRect(player.x*tile,player.y*tile,tile,tile);

  ctx.restore();
} else {
        ctx.fillStyle="#000";
        ctx.shadowBlur=0;
      }
      ctx.fillRect(x*tile,y*tile,tile,tile);
    }
  }

  // ゴール
  ctx.shadowBlur=12;
  ctx.fillStyle="yellow";
  ctx.fillRect(goal.x*tile,goal.y*tile,tile,tile);

  // プレイヤー
  ctx.shadowBlur=12;
  ctx.fillStyle="#00ffcc";
  ctx.fillRect(player.x*tile,player.y*tile,tile,tile);

  // ===== 視界制限（グラデーション方式：確実に動く） =====
  ctx.shadowBlur = 0;

  // 暗闇レイヤー
  ctx.fillStyle = "rgba(0,0,0,0.92)";
  ctx.fillRect(0,0,canvas.width,canvas.height);

  const radius = tile * 3;

  // プレイヤーの光
  let grad1 = ctx.createRadialGradient(
    player.x*tile + tile/2,
    player.y*tile + tile/2,
    0,
    player.x*tile + tile/2,
    player.y*tile + tile/2,
    radius
  );
  grad1.addColorStop(0, "rgba(0,0,0,0)");
  grad1.addColorStop(1, "rgba(0,0,0,0.92)");

  ctx.globalCompositeOperation = "destination-out";
  ctx.fillStyle = grad1;
  ctx.beginPath();
  ctx.arc(player.x*tile + tile/2, player.y*tile + tile/2, radius, 0, Math.PI*2);
  ctx.fill();

  // ゴールの光
  let grad2 = ctx.createRadialGradient(
    goal.x*tile + tile/2,
    goal.y*tile + tile/2,
    0,
    goal.x*tile + tile/2,
    goal.y*tile + tile/2,
    radius
  );
  grad2.addColorStop(0, "rgba(0,0,0,0)");
  grad2.addColorStop(1, "rgba(0,0,0,0.92)");

  ctx.fillStyle = grad2;
  ctx.beginPath();
  ctx.arc(goal.x*tile + tile/2, goal.y*tile + tile/2, radius, 0, Math.PI*2);
  ctx.fill();

  ctx.globalCompositeOperation = "source-over";
} else {
        ctx.fillStyle="#000";
        ctx.shadowBlur=0;
      }
      ctx.fillRect(x*tile,y*tile,tile,tile);
    }
  }

  // ゴール
  ctx.shadowBlur=12;
  ctx.fillStyle="yellow";
  ctx.fillRect(goal.x*tile,goal.y*tile,tile,tile);

  // プレイヤー
  ctx.shadowBlur=12;
  ctx.fillStyle="#00ffcc";
  ctx.fillRect(player.x*tile,player.y*tile,tile,tile);

  // ===== 視界制限（シンプル＆確実版） =====
  const radius = tile * 3;

  ctx.save();

  // まず暗くする
  ctx.shadowBlur = 0;
  ctx.globalCompositeOperation = "source-over";
  ctx.fillStyle = "rgba(0,0,0,0.9)";
  ctx.fillRect(0,0,canvas.width,canvas.height);

  // くり抜く
  ctx.globalCompositeOperation = "destination-out";
  ctx.beginPath();

  // プレイヤー
  ctx.arc(player.x*tile + tile/2, player.y*tile + tile/2, radius, 0, Math.PI*2);

  // ゴール
  ctx.moveTo(goal.x*tile + tile/2 + radius, goal.y*tile + tile/2);
  ctx.arc(goal.x*tile + tile/2, goal.y*tile + tile/2, radius, 0, Math.PI*2);

  ctx.fill();

  ctx.restore();
} else {
        ctx.fillStyle="#000";
        ctx.shadowBlur=0;
      }
      ctx.fillRect(x*tile,y*tile,tile,tile);
    }
  }

  // ゴール
  ctx.shadowBlur=12;
  ctx.fillStyle="yellow";
  ctx.fillRect(goal.x*tile,goal.y*tile,tile,tile);

  // プレイヤー
  ctx.shadowBlur=12;
  ctx.fillStyle="#00ffcc";
  ctx.fillRect(player.x*tile,player.y*tile,tile,tile);

  // ===== 視界制限（安定版） =====
  const radius = tile * 3;

  // 暗闇をかける
  ctx.fillStyle = "rgba(0,0,0,0.9)";
  ctx.fillRect(0,0,canvas.width,canvas.height);

  // 見える範囲だけ消す（クリア）
  ctx.save();
  ctx.beginPath();

  // プレイヤー
  ctx.arc(player.x*tile + tile/2, player.y*tile + tile/2, radius, 0, Math.PI*2);

  // ゴール
  ctx.moveTo(goal.x*tile + tile/2 + radius, goal.y*tile + tile/2);
  ctx.arc(goal.x*tile + tile/2, goal.y*tile + tile/2, radius, 0, Math.PI*2);

  ctx.clip();
  ctx.clearRect(0,0,canvas.width,canvas.height);
  ctx.restore();
} else {
        ctx.fillStyle="#000";
        ctx.shadowBlur=0;
      }
      ctx.fillRect(x*tile,y*tile,tile,tile);
    }
  }

  // ゴール
  ctx.shadowBlur=12;
  ctx.fillStyle="yellow";
  ctx.fillRect(goal.x*tile,goal.y*tile,tile,tile);

  // プレイヤー
  ctx.shadowBlur=12;
  ctx.fillStyle="#00ffcc";
  ctx.fillRect(player.x*tile,player.y*tile,tile,tile);

  // ===== 視界制限 =====
  ctx.save();

  // 全体を暗く
  ctx.globalCompositeOperation = "source-over";
  ctx.fillStyle = "rgba(0,0,0,0.9)";
  ctx.fillRect(0,0,canvas.width,canvas.height);

  // くり抜きモード
  ctx.globalCompositeOperation = "destination-out";
  ctx.shadowBlur = 0;

  const radius = tile * 3;

  // プレイヤー
  ctx.beginPath();
  ctx.arc(player.x*tile + tile/2, player.y*tile + tile/2, radius, 0, Math.PI*2);
  ctx.fill();

  // ゴール
  ctx.beginPath();
  ctx.arc(goal.x*tile + tile/2, goal.y*tile + tile/2, radius, 0, Math.PI*2);
  ctx.fill();

  ctx.restore();
} else {
        ctx.fillStyle="#000";
        ctx.shadowBlur=0;
      }
      ctx.fillRect(x*tile,y*tile,tile,tile);
    }
  }

  // ゴール
  ctx.shadowBlur=12;
  ctx.fillStyle="yellow";
  ctx.fillRect(goal.x*tile,goal.y*tile,tile,tile);

  // プレイヤー
  ctx.shadowBlur=12;
  ctx.fillStyle="#00ffcc";
  ctx.fillRect(player.x*tile,player.y*tile,tile,tile);

  // ===== 視界制限 =====
  const radius = tile * 3; // 半径3マス

  // 暗闇レイヤー
  ctx.fillStyle = "rgba(0,0,0,0.9)";
  ctx.fillRect(0,0,canvas.width,canvas.height);

  // プレイヤー周りをくり抜く
  ctx.globalCompositeOperation = "destination-out";
  ctx.beginPath();
  ctx.arc(
    player.x*tile + tile/2,
    player.y*tile + tile/2,
    radius,
    0,
    Math.PI*2
  );
  ctx.fill();

  // ゴール周りもくり抜く
  ctx.beginPath();
  ctx.arc(
    goal.x*tile + tile/2,
    goal.y*tile + tile/2,
    radius,
    0,
    Math.PI*2
  );
  ctx.fill();

  ctx.globalCompositeOperation = "source-over";
} else {
        ctx.fillStyle="#000";
        ctx.shadowBlur=0;
      }
      ctx.fillRect(x*tile,y*tile,tile,tile);
    }
  }

  ctx.shadowBlur=12;
  ctx.fillStyle="yellow";
  ctx.fillRect(goal.x*tile,goal.y*tile,tile,tile);

  ctx.shadowBlur=12;
  ctx.fillStyle="#00ffcc";
  ctx.fillRect(player.x*tile,player.y*tile,tile,tile);
}

function move(dx,dy){
  const nx=player.x+dx, ny=player.y+dy;
  if (maze[ny] && maze[ny][nx]===0){
    player.x=nx; player.y=ny;
  }
  if (player.x===goal.x && player.y===goal.y){
    setTimeout(()=>alert("クリア！"),100);
  }
}

document.addEventListener("keydown",e=>{
  if(e.key==="ArrowUp")move(0,-1);
  if(e.key==="ArrowDown")move(0,1);
  if(e.key==="ArrowLeft")move(-1,0);
  if(e.key==="ArrowRight")move(1,0);
});

function loop(){ draw(); requestAnimationFrame(loop); }
loop();
</script>
</body>
</html>
