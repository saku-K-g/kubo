<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>高難易度ピクセル迷路</title>
<style>
  body {
    margin: 0;
    background: #000;
    overflow: hidden;
  }
  canvas {
    display: block;
    image-rendering: pixelated;
  }
</style>
</head>
<body>
<canvas id="game"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
window.addEventListener("resize", resize);
resize();

const SIZE = 61; // 迷路を大きくして複雑に
const maze = Array.from({length: SIZE}, () => Array(SIZE).fill(1));

// 迷路生成（DFS）
function generateMaze(x, y) {
  const dirs = [[2,0],[-2,0],[0,2],[0,-2]].sort(() => Math.random() - 0.5);
  for (let [dx, dy] of dirs) {
    const nx = x + dx;
    const ny = y + dy;
    if (ny > 0 && ny < SIZE-1 && nx > 0 && nx < SIZE-1 && maze[ny][nx] === 1) {
      maze[ny][nx] = 0;
      maze[y + dy/2][x + dx/2] = 0;
      generateMaze(nx, ny);
    }
  }
}

maze[1][1] = 0; // スタート
generateMaze(1,1);

// ゴールを一番遠い位置に設定
function findFarthestPoint() {
  const visited = Array.from({length: maze.length}, () => Array(maze[0].length).fill(false));
  const queue = [{x:1,y:1,dist:0}];
  visited[1][1] = true;
  let farthest = {x:1,y:1,dist:0};

  while(queue.length) {
    const {x,y,dist} = queue.shift();
    if (dist > farthest.dist) farthest = {x,y,dist};

    const dirs = [[1,0],[-1,0],[0,1],[0,-1]];
    for (let [dx,dy] of dirs) {
      const nx = x + dx;
      const ny = y + dy;
      if (maze[ny] && maze[ny][nx] === 0 && !visited[ny][nx]) {
        visited[ny][nx] = true;
        queue.push({x:nx,y:ny,dist:dist+1});
      }
    }
  }
  return farthest;
}

let player = {x:1,y:1};
let goal = findFarthestPoint();
maze[goal.y][goal.x] = 0;

function draw() {
  const tileSize = Math.floor(Math.min(canvas.width, canvas.height) / SIZE);

  ctx.clearRect(0,0,canvas.width,canvas.height);

  for (let y = 0; y < maze.length; y++) {
    for (let x = 0; x < maze[y].length; x++) {
      // 見やすい配色に変更
      // ネオン風配色
      if (maze[y][x]) {
        ctx.fillStyle = "#6a00ff";
        ctx.shadowColor = "#9d4dff";
        ctx.shadowBlur = 8;
      } else {
        ctx.fillStyle = "#000";
        ctx.shadowBlur = 0;
      }
      ctx.fillRect(x * tileSize, y * tileSize, tileSize, tileSize);
    }
  }

  ctx.fillStyle = "yellow";
  ctx.fillRect(goal.x * tileSize, goal.y * tileSize, tileSize, tileSize);

  ctx.fillStyle = "lime";
  ctx.fillRect(player.x * tileSize, player.y * tileSize, tileSize, tileSize);
}

function move(dx, dy) {
  const nx = player.x + dx;
  const ny = player.y + dy;
  if (maze[ny] && maze[ny][nx] === 0) {
    player.x = nx;
    player.y = ny;
  }
  if (player.x === goal.x && player.y === goal.y) {
    setTimeout(()=>alert("クリア！"),100);
  }
}

document.addEventListener("keydown", e => {
  if (e.key === "ArrowUp") move(0,-1);
  if (e.key === "ArrowDown") move(0,1);
  if (e.key === "ArrowLeft") move(-1,0);
  if (e.key === "ArrowRight") move(1,0);
});

function loop(){
  draw();
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
