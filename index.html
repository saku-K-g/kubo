<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>ネオン迷路</title>
<style>
  body { margin:0; background:#000; overflow:hidden; }
  canvas { display:block; }
</style>
</head>

<body>
<canvas id="game"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

// 画面サイズ
function resize(){
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
window.addEventListener("resize", resize);
resize();

// ===== 迷路 =====
const SIZE = 31;
const maze = Array.from({length: SIZE}, () => Array(SIZE).fill(1));

function generateMaze(x,y){
  const dirs = [[2,0],[-2,0],[0,2],[0,-2]].sort(()=>Math.random()-0.5);
  for (let [dx,dy] of dirs){
    const nx = x+dx, ny = y+dy;
    if (ny>0 && ny<SIZE-1 && nx>0 && nx<SIZE-1 && maze[ny][nx]===1){
      maze[ny][nx]=0;
      maze[y+dy/2][x+dx/2]=0;
      generateMaze(nx,ny);
    }
  }
}

maze[1][1]=0;
generateMaze(1,1);

// 分岐追加
function addBranches(rate=0.15){
  for (let y=1;y<SIZE-1;y++){
    for (let x=1;x<SIZE-1;x++){
      if (maze[y][x]===1 && Math.random()<rate){
        let count=0;
        if (maze[y+1][x]===0) count++;
        if (maze[y-1][x]===0) count++;
        if (maze[y][x+1]===0) count++;
        if (maze[y][x-1]===0) count++;
        if (count>=2) maze[y][x]=0;
      }
    }
  }
}
addBranches();

// プレイヤー
let player = {x:1,y:1};

// ゴール
function findFarthest(){
  const visited = Array.from({length: SIZE},()=>Array(SIZE).fill(false));
  const q=[{x:1,y:1,d:0}];
  visited[1][1]=true;
  let far={x:1,y:1,d:0};

  while(q.length){
    const {x,y,d}=q.shift();
    if (d>far.d) far={x,y,d};
    [[1,0],[-1,0],[0,1],[0,-1]].forEach(([dx,dy])=>{
      const nx=x+dx, ny=y+dy;
      if (maze[ny] && maze[ny][nx]===0 && !visited[ny][nx]){
        visited[ny][nx]=true;
        q.push({x:nx,y:ny,d:d+1});
      }
    });
  }
  return far;
}
let goal = findFarthest();

// ===== 描画 =====
function draw(){
  const tile = Math.floor(Math.min(canvas.width,canvas.height)/SIZE);
  ctx.clearRect(0,0,canvas.width,canvas.height);

  // 迷路描画（ネオン）
  for (let y=0;y<SIZE;y++){
    for (let x=0;x<SIZE;x++){

      if (maze[y][x]) {
        ctx.shadowBlur = 8;
        ctx.shadowColor = "#00ffff";
        ctx.fillStyle = "#00ffff";
      } else {
        ctx.shadowBlur = 0;
        ctx.fillStyle = "#111";
      }

      ctx.fillRect(x*tile,y*tile,tile,tile);
    }
  }

  // ゴール
  ctx.shadowBlur = 15;
  ctx.shadowColor = "yellow";
  ctx.fillStyle="yellow";
  ctx.fillRect(goal.x*tile,goal.y*tile,tile,tile);

  // プレイヤー
  ctx.shadowBlur = 15;
  ctx.shadowColor = "#00ffcc";
  ctx.fillStyle="#00ffcc";
  ctx.fillRect(player.x*tile,player.y*tile,tile,tile);

  // ===== 視界制限 =====
  const radius = tile * 3;

  ctx.save();

  ctx.fillStyle = "rgba(0,0,0,0.9)";
  ctx.fillRect(0,0,canvas.width,canvas.height);

  ctx.globalCompositeOperation = "destination-out";

  // プレイヤー
  ctx.beginPath();
  ctx.arc(player.x*tile + tile/2, player.y*tile + tile/2, radius, 0, Math.PI*2);
  ctx.fill();

  // ゴール
  ctx.beginPath();
  ctx.arc(goal.x*tile + tile/2, goal.y*tile + tile/2, radius, 0, Math.PI*2);
  ctx.fill();

  ctx.restore();
}

// ===== 移動 =====
function move(dx,dy){
  const nx=player.x+dx, ny=player.y+dy;
  if (maze[ny] && maze[ny][nx]===0){
    player.x=nx;
    player.y=ny;
  }

  if (player.x===goal.x && player.y===goal.y){
    setTimeout(()=>alert("クリア！"),100);
  }
}

// キー操作
document.addEventListener("keydown",e=>{
  if(e.key==="ArrowUp")move(0,-1);
  if(e.key==="ArrowDown")move(0,1);
  if(e.key==="ArrowLeft")move(-1,0);
  if(e.key==="ArrowRight")move(1,0);
});

// ループ
function loop(){
  draw();
  requestAnimationFrame(loop);
}
loop();
</script>

</body>
</html>
